name: Release extensions

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - package.json
      - .github/workflows/release.yml
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: extension-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test and build
        run: npm test
      - name: Resolve release version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$REF_TYPE" = "tag" ] && [ "$REF_NAME" != "v$VERSION" ]; then
            echo "Tag does not match package version"
            exit 1
          fi
          echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"
      - name: Validate version and extract release notes
        run: node scripts/release-notes.mjs
      - name: Package extensions
        run: |
          cd dist/chrome
          zip -r ../switchboard-chrome.zip .
          cd ../firefox
          zip -r ../switchboard-firefox.zip .
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            dist/switchboard-chrome.zip dist/switchboard-firefox.zip \
            --target "$RELEASE_COMMIT" --title "Switchboard $RELEASE_TAG" \
            --notes-file dist/release-notes.md
