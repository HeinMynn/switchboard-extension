name: Release extensions

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test and build
        run: npm test
      - name: Validate version and extract release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-notes.mjs
      - name: Package extensions
        run: |
          cd dist/chrome
          zip -r ../switchboard-chrome.zip .
          cd ../firefox
          zip -r ../switchboard-firefox.zip .
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          dist/switchboard-chrome.zip dist/switchboard-firefox.zip
          --verify-tag --title "Switchboard $RELEASE_TAG"
          --notes-file dist/release-notes.md
